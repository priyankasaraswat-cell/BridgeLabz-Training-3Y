
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments, captured forever.</p>
    </header>

    <main class="gallery">

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                 alt="Beautiful mountain lake">
            <figcaption>Mountain Escape</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                 alt="Scenic nature landscape">
            <figcaption>Nature's Beauty</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80"
                 alt="Blue ocean waves">
            <figcaption>Ocean Waves</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80"
                 alt="Sunrise over a landscape">
            <figcaption>Golden Sunrise</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Green forest with sunlight">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain scenery beside a lake">
            <figcaption>Peaceful Valley</figcaption>
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
