
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .product-card img {
            height: 200px;
            object-fit: contain;
            padding: 15px;
        }

        body {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center p-4">
        <h1>My Shopping Store</h1>
        <p class="mb-0">Find Your Favourite Products</p>
    </header>

    <!-- Product Catalog -->
    <div class="container my-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x200?text=Headphones"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="text-success fw-bold">₹1,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x200?text=Smart+Watch"
                         class="card-img-top" alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="text-success fw-bold">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x200?text=Shoes"
                         class="card-img-top" alt="Shoes">

                    <div class="card-body text-center">
                        <h5 class="card-title">Sports Shoes</h5>
                        <p class="text-success fw-bold">₹1,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x200?text=Backpack"
                         class="card-img-top" alt="Backpack">

                    <div class="card-body text-center">
                        <h5 class="card-title">Travel Backpack</h5>
                        <p class="text-success fw-bold">₹999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 My Shopping Store. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
