
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="height-width.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice Layout</h1>
        <p>Examples of different CSS dimensions</p>
    </header>

    <main>
        <section class="container">

            <div class="box box1">
                <h3>Box 1</h3>
                <p>Width: 150px</p>
                <p>Height: 120px</p>
            </div>

            <div class="box box2">
                <h3>Box 2</h3>
                <p>Width: 30%</p>
                <p>Height: 25vh</p>
            </div>

            <div class="box box3">
                <h3>Box 3</h3>
                <p>Width: 12em</p>
                <p>Height: 10em</p>
                <p>This box demonstrates overflow property.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>HTML and CSS Practical Assignment</p>
    </footer>

</body>
</html>
