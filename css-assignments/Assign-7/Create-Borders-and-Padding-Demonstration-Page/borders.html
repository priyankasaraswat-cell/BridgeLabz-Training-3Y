
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <!-- Linking CSS file -->
    <link rel="stylesheet" href="borders.css">
</head>
<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>
        <section class="container">
            <div class="box solid">Solid Border</div>
            <div class="box dashed">Dashed Border</div>
            <div class="box double">Double Border</div>
            <div class="box groove">Groove Border</div>
            <div class="box rounded">Rounded Corners</div>
        </section>

        <h2>Padding Demonstration</h2>

        <section class="container">
            <div class="box small">Small Padding</div>
            <div class="box medium">Medium Padding</div>
            <div class="box large">Large Padding</div>
        </section>
    </main>

    <footer>
        <p>HTML and CSS Practical</p>
    </footer>

</body>
</html>
