
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="transformations.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation.</p>
    </header>

    <main>
        <section class="container">

            <div class="item">
                <div class="box rotate">Rotate</div>
                <p>rotate(45deg)</p>
            </div>

            <div class="item">
                <div class="box scale">Scale</div>
                <p>scale(1.3)</p>
            </div>

            <div class="item">
                <div class="box translate">Translate</div>
                <p>translate(20px, -20px)</p>
            </div>

            <div class="item">
                <div class="box skew">Skew</div>
                <p>skew(20deg)</p>
            </div>

        </section>
    </main>

    <footer>
        <p>HTML and CSS Practical Assignment</p>
    </footer>

</body>
</html>
