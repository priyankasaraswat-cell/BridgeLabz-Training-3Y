
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Webpage</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="gradient.css">
</head>
<body>

    <!-- Fixed header -->
    <header>
        <h2>Gradient Background Website</h2>
    </header>

    <main>
        <!-- Linear gradient section -->
        <section class="linear">
            <h1>Linear Gradient</h1>
            <p>
                A linear gradient blends two or more colors
                in a straight direction.
            </p>
        </section>

        <!-- Radial gradient section -->
        <section class="radial">
            <h1>Radial Gradient</h1>
            <p>
                A radial gradient blends colors outward
                from a central point in a circular or elliptical shape.
            </p>
        </section>
    </main>

    <!-- Fixed footer -->
    <footer>
        <p>HTML and CSS Practical Assignment</p>
    </footer>

</body>
</html>
