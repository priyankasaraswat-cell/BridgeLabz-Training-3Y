
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="image-showcase.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Explore beautiful places around the world.</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                         alt="Beautiful green landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Landscape</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600"
                         alt="Mountain under a starry sky">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                         alt="Blue ocean and beach">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Beach</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                         alt="Sunlight in a green forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600"
                         alt="Ocean waves">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean Waves</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                         alt="Snow-covered mountain peaks">
                    <div class="overlay"></div>
                </div>
                <figcaption>Snowy Mountains</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Image Showcase | HTML and CSS Practical</p>
    </footer>

</body>
</html>
