
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="tooltip.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over each item to see its tooltip.</p>
    </header>

    <main class="container">

        <section class="item">
            <span class="icon">💡</span>
            <h3>Ideas</h3>
            <span class="tooltip">Creative ideas</span>
        </section>

        <section class="item">
            <span class="icon">📚</span>
            <h3>Books</h3>
            <span class="tooltip">Learn something new</span>
        </section>

        <section class="item">
            <span class="icon">💻</span>
            <h3>Coding</h3>
            <span class="tooltip">Write and run code</span>
        </section>

        <section class="item">
            <span class="icon">🎯</span>
            <h3>Goals</h3>
            <span class="tooltip">Focus on your goals</span>
        </section>

    </main>

    <footer>
        <p>HTML and CSS Practical</p>
    </footer>

</body>
</html>
