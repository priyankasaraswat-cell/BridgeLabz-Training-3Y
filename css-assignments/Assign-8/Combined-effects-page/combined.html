
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects Demonstration</title>
    <link rel="stylesheet" href="combined-effects.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the buttons and cards to see the effects.</p>
    </header>

    <main>
        <section class="container">

            <div class="card">
                <h2>Hover Effect</h2>
                <p>The button changes color and grows on hover.</p>
                <button class="btn btn-primary">Hover Me</button>
            </div>

            <div class="card">
                <h2>Transform Effect</h2>
                <p>The card moves upward when you hover over it.</p>
                <button class="btn btn-success">Explore</button>
            </div>

            <div class="card">
                <h2>Shadow Effect</h2>
                <p>The button displays a shadow on hover.</p>
                <button class="btn btn-danger">Click Me</button>
            </div>

        </section>
    </main>

    <footer>
        <p>HTML and CSS Practical Assignment</p>
    </footer>

</body>
</html>
