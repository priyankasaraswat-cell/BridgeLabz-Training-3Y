
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Section Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <nav>
            <a href="#services">Services</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main section with three boxes -->
    <main>
        <section class="box" id="services">
            <h2>Services</h2>
            <p>We provide quality web development services.</p>
        </section>

        <section class="box" id="projects">
            <h2>Projects</h2>
            <p>Explore our creative and innovative projects.</p>
        </section>

        <section class="box" id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us for more information.</p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
