
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over images to remove filters.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur"
                     src="https://picsum.photos/id/10/400/300"
                     alt="Nature">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale"
                     src="https://picsum.photos/id/20/400/300"
                     alt="Workspace">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia"
                     src="https://picsum.photos/id/30/400/300"
                     alt="Coffee">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness"
                     src="https://picsum.photos/id/40/400/300"
                     alt="Landscape">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast"
                     src="https://picsum.photos/id/50/400/300"
                     alt="Scenery">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue"
                     src="https://picsum.photos/id/60/400/300"
                     alt="Architecture">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Grid and Filter Demonstration</p>
    </footer>

</body>
</html>
