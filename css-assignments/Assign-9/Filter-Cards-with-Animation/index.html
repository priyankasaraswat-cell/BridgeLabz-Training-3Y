
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Team</h1>
        <p>Meet our creative team members.</p>
    </header>

    <main>
        <section class="container">

            <div class="card">
                <img class="grayscale"
                     src="https://i.pravatar.cc/300?img=47"
                     alt="Profile of Priya">
                <h2>Priya Sharma</h2>
                <p>Web Designer</p>
            </div>

            <div class="card">
                <img class="sepia"
                     src="https://i.pravatar.cc/300?img=12"
                     alt="Profile of Rahul">
                <h2>Rahul Verma</h2>
                <p>Web Developer</p>
            </div>

            <div class="card">
                <img class="blur"
                     src="https://i.pravatar.cc/300?img=44"
                     alt="Profile of Ananya">
                <h2>Ananya Singh</h2>
                <p>UI/UX Designer</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Filters and Animation Practical</p>
    </footer>

</body>
</html>
