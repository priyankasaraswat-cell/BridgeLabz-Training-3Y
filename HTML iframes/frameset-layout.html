<!DOCTYPE html>
<html lang="en">
<head>
    <title>Frameset Layout</title>
</head>

<!-- Frameset divides the page into top and bottom sections -->
<frameset rows="30%,70%">

    <!-- Top frame for navigation links -->
    <frame src="navigation.html" name="navigation">

    <!-- Bottom frame for welcome message -->
    <frame src="welcome.html" name="content">

</frameset>

</html>
