<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Specifies UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Nandini Agrawal">

    <!-- Makes the webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title of the webpage -->
    <title>UTF-8 Encoding Example</title>
</head>
<body>

    <!-- Paragraph containing English, Hindi, and Japanese text -->
    <p>
        Hello, welcome to my webpage.
        नमस्ते, मेरे वेबपेज पर आपका स्वागत है।
        こんにちは、私のウェブページへようこそ。
    </p>

</body>
</html>
