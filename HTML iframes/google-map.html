<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>
<body>

    <!-- Google Map of Etawah city -->
    <!-- loading="lazy" loads the map only when it is needed on the screen -->
    <iframe
        src="https://www.google.com/maps?q=Etawah,Uttar+Pradesh,India&output=embed"
        title="Google Map of Etawah"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
