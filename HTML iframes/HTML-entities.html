<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>

    <!-- Paragraph displaying special characters using HTML entities -->
    <p>
        Less than: &lt;
        Greater than: &gt;
        Ampersand: &amp;
        Double quotation: &quot;
        Single quotation: &apos;
        Copyright: &copy;
        Trademark: &trade;
        Registered trademark: &reg;
    </p>

</body>
</html>
